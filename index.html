  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mobile Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="manifest" href="manifest.json?version=2" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #222;
    }

    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Hide custom controls, use Leaflet's */
    .controls,
    .move-controls {
      display: none;
    }
  </style>
  <style>
    .side-buttons {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 1000;
    }

    .side-buttons button {
      width: 15vw;
      height: 15vw;
      border-radius: 50%;
      border: none;
      /* background: rgba(0, 0, 0, 0.7); */
      color: #fff;
      font-size: 1.7em;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      outline: none;
      transition: background 0.2s;
      padding: 0;
    }

    .side-buttons button:active {
      background: #444;
    }

    .side-buttons svg {
      width: 90%;
      height: 90%;
      display: block;
    }
  </style>
</head>
<style>
  .custom-svg-marker svg {
    width: 10vw;
    height: 10vw;
    display: block;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    border-radius: 100%;
    border: solid 3px white;
  }
</style>

  <section id="installation_pwa_section" style="visibility: collapse">
    install app
    <button id="install_pwa_button">install</button>
  </section>
  <script>
    console.log("HelpMap ");
    if ("serviceWorker" in navigator) {
      // register service worker
      navigator.serviceWorker.register("service-worker.js");
    }
    let installPrompt = null;
    const installSection = document.querySelector(
      "#installation_pwa_section"
    );
    const installButton = document.querySelector("#install_pwa_button");

    window.addEventListener("beforeinstallprompt", (event) => {
      debugger
      alert("App can be installed");
      event.preventDefault();
      installPrompt = event;
      //  installButton.removeAttribute("hidden");
      installSection.style.visibility = "visible";
    });
    function disableInAppInstallPrompt() {
      installPrompt = null;
      installButton.setAttribute("hidden", "");
    }
    installButton.addEventListener("click", async () => {
      if (!installPrompt) {
        return;
      }
      const result = await installPrompt.prompt();
      console.log(`Install prompt was: ${result.outcome}`);
      disableInAppInstallPrompt();
    });

    window.addEventListener("appinstalled", () => {
      disableInAppInstallPrompt();
    });

    //
    let userLat = null,
      userLng = null;
    let allData = [];
    let allMarkers = [];
    let allLanguages = [];
    function getDistance(lat1, lng1, lat2, lng2) {
      // Haversine formula
      const R = 6371e3;
      const toRad = (x) => (x * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }
    function filterMarkersByLanguage(lang) {
      allMarkers.forEach((obj) => {
        const itemLang = (obj.item?.acf?.language || "").trim();
        if (!lang || itemLang === lang) {
          obj.marker.addTo(map);
        } else {
          map.removeLayer(obj.marker);
        }
      });
    }

    function showLanguageModal() {
      // Create unique language list
      const langs = Array.from(
        new Set(
          allData
            .map((item) => (item?.acf?.language || "").trim())
            .filter((l) => l)
        )
      );
      allLanguages = langs;
      const btns = langs
        .map(
          (lang) =>
            `<button class="lang-select-btn" data-lang="${lang}" style="margin:6px 0;padding:10px 0;width:100%;font-size:1.1em;border-radius:8px;border:none;background:#222;color:#fff;cursor:pointer;">${lang}</button>`
        )
        .join("");
      showModal(
        `<h2 style='margin-top:0'>Select Language</h2><div style='display:flex;flex-direction:column;gap:0.5em;'>${btns}</div>`
      );
      setTimeout(() => {
        document.querySelectorAll(".lang-select-btn").forEach((btn) => {
          btn.addEventListener("click", function () {
            const lang = this.getAttribute("data-lang");
            window.lastSelectedLanguage = lang;
            filterMarkersByLanguage(lang);
            hideModal();
          });
        });
      }, 50);
    }

    // --- Typology Filter ---
    let activeTypologies = null; // null means all active

    function getAllTypologies() {
      // Gather all unique typologies from data
      return Array.from(
        new Set(
          allData
            .map((item) => (item?.acf?.tipologia || "").trim())
            .filter((t) => t)
        )
      );
    }

    function showTypologyFilterModal() {
      const allTypes = getAllTypologies();
      if (!activeTypologies) activeTypologies = new Set(allTypes);
      const btns = allTypes
        .map((type) => {
          const isActive = activeTypologies.has(type);
          const icon = svgIcons[type] || svgIcons["information_point"];
          return `<div class="typology-filter-btn${isActive ? " active" : ""
            }" data-type="${type}" style="padding:8px 8px;width:fit-content;font-size:1.1em; border-radius:8px;opacity:${isActive ? "1" : "0.5"
            };cursor:pointer;display:flex;align-items:center;gap:5px;justify-content:flex-start;flex-direction:row">
                    <span style='width:10vw;height:10vw;display:inline-block;'>${icon}</span>
                    <span>${type}</span>
                </div>`;
        })
        .join("");
      const resetBtn = `<button id="typology-reset-btn" style="margin:12px 0 0 0;padding: 8px 8px;width:fit-content;font-size: 0.7em;border-radius:8px;border:2px solid #888;background:#fff;color:#222;cursor:pointer;">reset</button>`;
      const goBtn = `<button id="apply-filters-btn" style="margin:12px 0 0 0;padding:8px 0;width:100%;font-size:1.1em;border-radius:8px;border:2px solid #888;background:#fff;color:#222;cursor:pointer;">APPLY FILTERS</button>`;
      showModal(
        `<h2 style='margin-top:0;display: flex;flex-direction: row;align-items: center;justify-content: space-around;'>Filter by Type ${resetBtn}</h2><div style='display:flex;flex-direction:column;justify-content:center;align-items:flex-start;flex-wrap:wrap;'>${btns}${goBtn}</div>`
      );
      setTimeout(() => {
        document
          .getElementById("apply-filters-btn")
          .addEventListener("click", function () {
            filterMarkersByTypology();
            hideModal();
          });
        document.querySelectorAll(".typology-filter-btn").forEach((btn) => {
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            const type = this.getAttribute("data-type");
            if (activeTypologies.has(type)) {
              activeTypologies.delete(type);
            } else {
              activeTypologies.add(type);
            }
            // If none selected, treat as all selected
            if (activeTypologies.size === 0) {
              activeTypologies = new Set(getAllTypologies());
            }
            // Update button states
            document.querySelectorAll(".typology-filter-btn").forEach((b) => {
              const t = b.getAttribute("data-type");
              if (activeTypologies.has(t)) {
                b.classList.add("active");
                b.style.opacity = 1;
              } else {
                b.classList.remove("active");
                b.style.opacity = 0.5;
              }
            });
            filterMarkersByTypology();
          });
        });
        const reset = document.getElementById("typology-reset-btn");
        if (reset) {
          reset.addEventListener("click", function () {
            activeTypologies = new Set(getAllTypologies());
            document.querySelectorAll(".typology-filter-btn").forEach((b) => {
              b.classList.add("active");
              b.style.opacity = 1;
            });
            filterMarkersByTypology();
          });
        }
      }, 50);
    }
    // --- Search Modal Logic ---
    document
      .getElementById("search-btn")
      .addEventListener("click", function () {
        showSearchModal();
      });

    function showSearchModal() {
      let currentLang = window.lastSelectedLanguage || null;
      if (!currentLang) {
        // Try to infer from visible markers
        const visible = allMarkers.filter((obj) => map.hasLayer(obj.marker));
        const langs = Array.from(
          new Set(
            visible
              .map((obj) => (obj.item?.acf?.language || "").trim())
              .filter((l) => l)
          )
        );
        if (langs.length === 1) currentLang = langs[0];
      }
      let searchValue = "";
      // Initial filtered list: all markers of currentLang
      let filteredMarkers = allMarkers.filter((obj) => {
        const lang = (obj.item?.acf?.language || "").trim();
        return currentLang ? lang === currentLang : true;
      });
      function renderList() {
        const val = searchValue.trim().toLowerCase();
        let list = filteredMarkers;
        if (val) {
          list = filteredMarkers.filter((obj) => {
            const acf = obj.item.acf || {};
            const title = (acf.title || "").toLowerCase();
            const desc = (acf.description || "").toLowerCase();
            return title.includes(val) || desc.includes(val);
          });
        }
        if (list.length === 0) {
          return `<div style='color:#888;padding:12px 0;text-align:center;'>No results found.</div>`;
        }
        return list
          .map((obj) => {
            const acf = obj.item.acf || {};
            const tip = acf.tipologia;
            const [lat, lng] = acf.lat_long.split(",").map(Number);
            let distance = getDistance(userLat, userLng, lat, lng);
            let measure = "m";
            if (distance > 1000) {
              measure = "km";
              distance = (distance / 1000).toFixed(1);
            } else {
              distance = Math.round(distance);
            }
            const distanceString = ` ${distance}${measure}`;
            const icon = svgIcons[tip] || svgIcons["information_point"];
            return `<button class="marker-list-btn" data-marker-id="${obj.item.id
              }" style="margin:6px 0;padding:8px 5px;width:100%;font-size:1em;border-radius:8px;border:1px solid #888;background:#fff;color:#222;cursor:pointer;display:flex;align-items:center;gap:12px;justify-content:flex-start;">

                        <span style='font-weight:bold;'>${acf.title || ""
              } - ${distanceString}</span>
                    </button>`;
          })
          .join("");

                <input id='search-input' type='text' placeholder='Type to search...' style='width:100%;font-size:1.1em;padding:8px 10px;margin-bottom:12px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;'>

                </div>

        const listDiv = document.getElementById("search-list");

              );

            });
          });
        }
        bindListBtns();
      }, 50);

    // Initialize Leaflet map

    // Default center (Rome)
    let initialCenter = [41.9028, 12.4964];
    let initialZoom = 13;
    const map = L.map("map", {
      zoomControl: true,
      attributionControl: false,
      dragging: true,
      tap: true,
      touchZoom: true,
      scrollWheelZoom: true,
      doubleClickZoom: true,
      boxZoom: false,
      keyboard: false,
    }).setView(initialCenter, initialZoom);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors",
      }
    ).addTo(map);

    // Try to use device geolocation
    function getCurrentLocationAndRender(openLangModal = false) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            userLat = position.coords.latitude;
            userLng = position.coords.longitude;
            map.setView([userLat, userLng], 15);
            // Optionally, add a marker for the user's location
            L.marker([userLat, userLng], {
              icon: L.icon({
                iconUrl: "assets/current_position_pointer.svg", // Use the logo icon for user location
                // iconUrl: svgIcons.current_position, // Use the logo icon for user location
                // iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowUrl:
                  "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
                shadowSize: [41, 41],
              }),
            })
              .addTo(map)
              .bindPopup("You are here");
          },
          function (err) {
            // If denied or error, keep default center and show modal for manual input
            console.warn("Geolocation error or denied:", err);
            showModal(`
                  <h2 style='margin-top:0'>Enter your location</h2>
                  <form id='manual-location-form' style='display:flex;gap:8px;flex-direction:column;'>
                    <input id='manual-location-input' type='text' placeholder='Enter address or city' style='font-size:1.1em;padding:8px;border-radius:6px;border:1px solid #ccc;width:100%' required />
                    <button id='manual-location-btn' type='submit' style='font-size:1.1em;padding:8px 0;border-radius:6px;background:#222;color:#fff;border:none;cursor:pointer;'>Find location</button>
                  </form>
                  <div id='manual-location-error' style='color:red;margin-top:8px;display:none;'></div>
                `);
            setTimeout(() => {
              const form = document.getElementById("manual-location-form");
              const input = document.getElementById("manual-location-input");
              const errorDiv = document.getElementById(
                "manual-location-error"
              );
              if (form && input) {
                form.addEventListener("submit", function (e) {
                  e.preventDefault();
                  const query = input.value.trim();
                  if (!query) return;
                  errorDiv.style.display = "none";
                  // Use Nominatim for geocoding
                  fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(
                      query
                    )}`
                  )
                    .then((r) => r.json())
                    .then((results) => {
                      if (results && results.length > 0) {
                        const lat = parseFloat(results[0].lat);
                        const lon = parseFloat(results[0].lon);
                        userLat = lat;
                        userLng = lon;
                        map.setView([lat, lon], 15);

                        const icon = L.divIcon({
                          className: "custom-svg-marker",
                          html: `<div style="width:10vw;height:10vw;display:flex;align-items:center;justify-content:center;">${svgIcons.current_position}</div>`,
                          iconSize: [50, 50],
                          iconAnchor: [18, 36],
                          popupAnchor: [0, -36],
                        });
                        const marker = L.marker([lat, lon], { icon }).addTo(
                          map
                        );

                        /*    L.marker([lat, lon], {
                                                  icon: L.icon({
                                                      iconUrl: svgIcons.current_position, // Use the logo icon for user location
                                                      iconSize: [25, 41],
                                                      iconAnchor: [12, 41],
                                                      popupAnchor: [1, -34],
                                                      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                                                      shadowSize: [41, 41]
                                                  })
                                              }).addTo(map).bindPopup('You are here');
                                              */
                        hideModal();
                        if (openLangModal) {
                          showLanguageModal();
                        }
                      } else {
                        errorDiv.textContent =
                          "Location not found. Try a different address.";
                        errorDiv.style.display = "block";
                      }
                    })
                    .catch(() => {
                      errorDiv.textContent = "Error searching for location.";
                      errorDiv.style.display = "block";
                    });
                });
              }
            }, 100);
          }
        );
      }
    }
    ///getCurrentLocationAndRender(true)
    // Make map always fill the screen
    function resizeMap() {
      const el = document.getElementById("map");
      el.style.width = window.innerWidth + "px";
      el.style.height = window.innerHeight + "px";
      map.invalidateSize();
    }
    window.addEventListener("resize", resizeMap);
    resizeMap();

    // Modal logic
    const modal = document.getElementById("modal-overlay");
    const closeModalBtn = document.getElementById("modal-close-btn");
    function showModal(contentHtml) {
      document.getElementById("modal-body").innerHTML = contentHtml || "";
      modal.style.display = "flex";
    }
    function hideModal() {
      modal.style.display = "none";
    }
    closeModalBtn.addEventListener("click", hideModal);
    // Optionally, close modal on overlay click (not on modal content)
    modal.addEventListener("click", function (e) {
      if (e.target === modal) hideModal();

    // Also patch manual location form to set userLat/userLng

    // List modal logic
    document
      .getElementById("list-btn")
      .addEventListener("click", function () {
        // Step 1: Show typology buttons
        const allTypes = getAllTypologies();
        const btns = allTypes
          .map((type) => {
            const icon = svgIcons[type] || svgIcons["information_point"];
            return `<button class="list-typology-btn" data-type="${type}" style="all:unset;display:flex;flex-direction:row;align-items:center;justify-content:start;gap: 10px;">
                    <span style='width:10vw;height:10vw;display:inline-block;'>${icon}</span>
                    <span>${type}</span>
                </button>`;
          })
          .join("");
        showModal(
          `<h2 style='margin-top:0'>Select Type</h2><div style='display:flex;flex-direction:column;gap:0.5em;'>${btns}</div>`
        );
        setTimeout(() => {
          document.querySelectorAll(".list-typology-btn").forEach((btn) => {
            btn.addEventListener("click", function () {
              const type = this.getAttribute("data-type");
              showListOfMarkersByType(type);
            });
          });
        }, 50);
      });

    function showListOfMarkersByType(type) {
      // Only show markers of this type AND current language
      let currentLang = window.lastSelectedLanguage || null;
      if (!currentLang) {
        // Try to infer from visible markers
        const visible = allMarkers.filter((obj) => map.hasLayer(obj.marker));
        const langs = Array.from(
          new Set(
            visible
              .map((obj) => (obj.item?.acf?.language || "").trim())
              .filter((l) => l)
          )
        );
        if (langs.length === 1) currentLang = langs[0];
      }
      const markers = allMarkers.filter((obj) => {
        const tip = (obj.item?.acf?.tipologia || "").trim();
        const lang = (obj.item?.acf?.language || "").trim();
        if (currentLang) {
          return tip === type && lang === currentLang;
        } else {
          return tip === type;
        }
      });
      // Compute distance from userLat/userLng
      let userPos = null;
      if (userLat !== null && userLng !== null) {
        userPos = [userLat, userLng];
      }

      let markerList = markers.map((obj) => {
        const latLong = obj.item?.acf?.lat_long;
        let dist = null;
        if (userPos && latLong) {
          const [lat, lng] = latLong.split(",").map(Number);
          dist = getDistance(userPos[0], userPos[1], lat, lng);
        }
        return { obj, dist };
      });
      // Sort by distance (nulls last)
      markerList.sort((a, b) => {
        if (a.dist === null && b.dist === null) return 0;
        if (a.dist === null) return 1;
        if (b.dist === null) return -1;
        return a.dist - b.dist;
      });
      // Step 2: Show list of markers
      const items = markerList
        .map(({ obj, dist }) => {
          const acf = obj.item.acf || {};
          const icon = svgIcons[type] || svgIcons["information_point"];
          let distStr = "";
          if (typeof dist === "number" && !isNaN(dist)) {
            if (dist > 1000) distStr = ` ${(dist / 1000).toFixed(1)} km`;
            else distStr = ` ${Math.round(dist)} m`;
          }
          return `<button class="marker-list-btn" data-marker-id="${obj.item.id
            }" style="margin:6px 0;padding:8px 5px;width:100%;font-size:1em;border-radius:8px;border:1px solid #888;background:#fff;color:#222;cursor:pointer;display:flex;align-items:center;gap:12px;justify-content:flex-start;">
                    <span style='width:15vw;height:15vw;display:flex;align-items:center;justify-content:center;'>${icon}</span>
                    <span style='font-weight:bold;text-align:start;'>${acf.title || ""
            }</span>
                    <span style='margin-left:auto;font-size:0.95em;color:#1976d2;'>${distStr}</span>
                </button>`;
        })
        .join("");
      let langInfo = "";
      if (currentLang)
        langInfo = `<div style='font-size:0.95em;color:#1976d2;margin-bottom:8px;'>Language: ${currentLang}</div>`;
      showModal(
        `<h2 style='margin-top:0'>${type}</h2>${langInfo}<div style='display:flex;flex-direction:column;gap:0.5em;'>${items}</div>`
      );
      setTimeout(() => {
        document.querySelectorAll(".marker-list-btn").forEach((btn) => {
          btn.addEventListener("click", function () {
            const markerId = this.getAttribute("data-marker-id");
            const found = allMarkers.find(
              (obj) => String(obj.item.id) === String(markerId)
            );
            if (found) {
              showMarkerDetailModal(found.item);
            }
          });
        });
      }, 50);
    }

    function showMarkerDetailModal(item) {
      const acf = item.acf || {};
      const tipologia = acf.tipologia;
      const iconSvg = svgIcons[tipologia] || svgIcons["information_point"];
      // Title and icon side by side
      const titleIcon = `<div style='display: flex;align-items: center;justify-content: center;'>
                <span style='width: 20vw;height: 20vw;'>${iconSvg}</span>
                <span class="modal-location-icon" style='font-size:1.2em;font-weight:bold;'>${acf.title ? acf.title : ""
        }</span>
            </div>`;
      // Address as Google Maps link
      let address = "";
      let lat = null,
        lng = null;
      let distanceSection = "";
      if (acf.lat_long) {
        [lat, lng] = acf.lat_long.split(",").map(Number);
        const distance = getDistance(userLat, userLng, lat, lng);
        distanceSection = `<div style='margin-bottom:8px;'><b>Distance:</b><br> ${distance} ${distance > 1000 ? "km" : "m"
          }</div>`;
      }
      if (acf.via && lat !== null && lng !== null) {
        const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
        address = `<div style='margin-bottom:8px;'><b>Address:</b><br> <a href='${gmapsUrl}' target='_blank' rel='noopener' style='color:#1976d2;text-decoration:underline;'>${acf.via}</a></div>`;
      }
      // Website link if present
      let website = "";
      if (acf.website) {
        website = `<div style='margin-bottom:8px;'><b>Website:</b><br> <a href='${acf.website}' target='_blank' rel='noopener' style='color:#1976d2;word-break:break-all;'>${acf.website}</a></div>`;
      }
      // Description
      let description = "";
      if (acf.description) {
        description = `<div style='margin-bottom:0;'>${acf.description}</div>`;
      }
      showModal(`
                <div style='display:flex;flex-direction:column;align-items:stretch;'>
                    ${titleIcon}
                    ${distanceSection}
                    ${address}
                    ${website}
                    ${description}
                </div>
            `);
    }
    document
      .getElementById("lang-btn")
      .addEventListener("click", function () {
        showLanguageModal();
      });
    document
      .getElementById("filter-btn")
      .addEventListener("click", function () {
        showTypologyFilterModal();
      });

    // Fetch and add points to the map
    fetch("https://www.centrodocumentazionebertani.org/wp-json/wp/v2/helpmap")
      .then((r) => r.json())
      .then((data) => {
        if (!Array.isArray(data)) return;
        allData = data;
        allMarkers = [];
        activeTypologies = null;
        data.forEach((item) => {
          const latLong = item?.acf?.lat_long;
          const tipologia = item?.acf?.tipologia;
          if (latLong) {
            const [lat, lng] = latLong.split(",").map(Number);
            // Use svgIcons and tipologia for marker icon
            let iconSvg =
              svgIcons[tipologia] || svgIcons["information_point"];
            // Create a custom Leaflet icon with the SVG
            const icon = L.divIcon({
              className: "custom-svg-marker",
              html: `<div style="width:10vw;height:10vw;display:flex;align-items:center;justify-content:center;">${iconSvg}</div>`,
              iconSize: [50, 50],
              iconAnchor: [18, 36],
              popupAnchor: [0, -36],
            });
            const marker = L.marker([lat, lng], { icon }).addTo(map);
            allMarkers.push({ marker, item });
            marker.on("click", function () {
              const acf = item.acf || {};

              let lat = null,
                lng = null;
              let distanceSection = "";
              if (acf.lat_long) {
                [lat, lng] = acf.lat_long.split(",").map(Number);
                let distance = getDistance(userLat, userLng, lat, lng);
                let meters = "m";
                if (distance > 1000) {
                  distance = (distance / 1000).toFixed(1);
                  meters = "km";
                }
                distanceSection = `<div style='margin-bottom:8px;'><b>Distance:</b><br> ${distance} ${meters}</div>`;
              }
              // Title and icon side by side
              const titleIcon = `<div style='display:flex;align-items:center;margin-bottom:10px;gap:5px;'>
                                <span style='width:20vw;height:20vw;display: flex;align-items: center;justify-content: center;'>${iconSvg}</span>
                                <span class="modal-location-icon" style='font-size:1.2em;font-weight:bold;'>${acf.title ? acf.title : ""
                }</span>
                            </div>`;
              // Address as Google Maps link
              let address = "";
              if (acf.via) {
                const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
                address = `<div style='margin-bottom:8px;'><b>Address:</b><br> <a href='${gmapsUrl}' target='_blank' rel='noopener' style='color:#1976d2;text-decoration:underline;'>${acf.via}</a></div>`;
              }
              // Website link if present
              let website = "";
              if (acf.website) {
                website = `<div style='margin-bottom:8px;'><b>Website:</b><br> <a href='${acf.website}' target='_blank' rel='noopener' style='color:#1976d2;word-break:break-all;'>${acf.website}</a></div>`;
              }
              // Description
              let description = "";
              if (acf.description) {
                description = `<div style='margin-bottom:0;'>${acf.description}</div>`;
              }
              showModal(`
                                <div style='display:flex;flex-direction:column;align-items:stretch;'>
                                    ${titleIcon}
                                    ${distanceSection}
                                    ${address}
                                    ${website}
                                    ${description}
                                </div>
                            `);
            });
          }
        });
        // Show language modal as soon as possible
        getCurrentLocationAndRender(true);
        /*
              document.getElementById('current-pos-btn').addEventListener('click', function () {
                  getCurrentLocationAndRender(false);
              });
              */
        //  setTimeout(showLanguageModal, 200);
      })
      .catch((err) => console.error("Error fetching map points:", err));
  </script>
</body>
